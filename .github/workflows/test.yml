name: Document Test Framework CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Run document tests
        run: npm run test:ci
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: tests/reports/
          retention-days: 30
      - name: Check test pass rate
        if: always()
        run: |
          LATEST_REPORT=$(ls -t tests/reports/report-*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            PASS_RATE=$(node -e "const r=require('$LATEST_REPORT'); console.log(r.passRate)")
            echo "Pass rate: ${PASS_RATE}%"
            if (( $(echo "$PASS_RATE < 80" | bc -l) )); then
              echo "::warning::Pass rate below 80%: ${PASS_RATE}%"
            fi
          fi
